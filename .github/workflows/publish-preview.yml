name: Publish Preview

on:
  push:
    tags:
      - "*.*.*-rc.*"

jobs:
  publish-preview:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Setup - Checkout code
        uses: actions/checkout@v4

      - name: Setup - Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup - Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Setup - Show Chrome version
        run: ${{ steps.setup-chrome.outputs.chrome-path }} --version

      - name: Setup - Extract version from tag
        id: extract_version
        run: |
          VERSION=${GITHUB_REF##*/}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Build - Install dependencies
        run: npm ci

      - name: Build - Run tests
        run: npm run test -- --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage

      - name: Build - Compile Angular app
        run: npm run build -- --configuration=production

      - name: Build - Archive Angular dist folder
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/

      - name: Build - Zip dist folder
        run: zip -r angular-dist.zip dist/

      - name: Build - Archive test reports (if any)
        id: zip_reports
        run: |
          mkdir -p artifacts
          copied=0
          [ -d coverage ] && cp -r coverage artifacts/ && copied=1
          [ -d test-results/junit ] && cp -r test-results/junit artifacts/ && copied=1
          if [ "$copied" = "1" ]; then
            (cd artifacts && zip -r ../test-report.zip .)
            echo "has_zip=true" >> $GITHUB_OUTPUT
          else
            echo "has_zip=false" >> $GITHUB_OUTPUT
          fi

      - name: Docker - Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker - Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker - Extract image name
        id: extract_imagename
        run: |
          raw_repo="${{ github.repository }}"
          NORMALIZED=$(echo "$raw_repo" | tr '[:upper:]' '[:lower:]' | tr '.' '-')
          echo "REPOSITORY_NORMALIZED=$NORMALIZED" >> $GITHUB_ENV
          echo "Extracted image name: $NORMALIZED"

      - name: Docker - Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPOSITORY_NORMALIZED }}:${{ env.VERSION }}

      - name: GitHub Release - Define asset list
        id: assets
        run: |
          files=("angular-dist.zip")
          if [ "${{ steps.zip_reports.outputs.has_zip }}" = "true" ]; then
            files+=("test-report.zip")
          fi
          echo "has_files=true" >> $GITHUB_OUTPUT
          {
            echo "files<<EOF"
            printf "%s\n" "${files[@]}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: GitHub Release - Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: PreRelease ${{ env.VERSION }}
          draft: false
          prerelease: true
          make_latest: false
          files: ${{ steps.assets.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
